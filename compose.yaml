name: banking-rl-lab
x-runtime: &runtime
  DATABASE_URL: postgresql+psycopg://lab_app:${APP_DB_PASSWORD:?run make up}@db:5432/banking_lab
  JWT_SECRET: ${JWT_SECRET:?run make up}
  APP_ENV: local
services:
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: lab_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up}
      POSTGRES_DB: banking_lab
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run make up}
    ports: ["127.0.0.1:${DB_PORT:-5440}:5432"]
    volumes:
      - lab-data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab_owner -d banking_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  migrate:
    image: banking-rl-lab:local
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://lab_owner:${POSTGRES_PASSWORD}@db:5432/banking_lab
      JWT_SECRET: ${JWT_SECRET}
    command: [alembic, upgrade, head]
    depends_on: {db: {condition: service_healthy}}
  api:
    image: banking-rl-lab:local
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment: *runtime
    ports: ["127.0.0.1:${API_PORT:-8010}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  tools:
    image: banking-rl-lab:local
    profiles: [tools]
    environment:
      <<: *runtime
      ADMIN_DATABASE_URL: postgresql+psycopg://lab_owner:${POSTGRES_PASSWORD}@db:5432/banking_lab
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      APP_ENV: test
      PYTHONPATH: /workspace/src
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: [python]
    depends_on: {db: {condition: service_healthy}}
  worker:
    image: banking-rl-lab:local
    profiles: [worker]
    environment: *runtime
    command: [python, -m, banking_lab.cli, worker]
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 256m
volumes:
  lab-data:
