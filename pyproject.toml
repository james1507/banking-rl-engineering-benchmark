[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-rl-engineering-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.5", "uvicorn==0.54.0", "SQLAlchemy==2.1.8",
  "psycopg[binary]==3.3.8", "alembic==1.20.1", "pydantic-settings==2.16.2",
  "PyJWT==2.15.1", "argon2-cffi==25.1.0", "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2"
]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "hypothesis==6.170.15", "ruff==0.17.4", "mypy==2.4.1", "pip-audit==2.10.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.ruff.lint.per-file-ignores]
"benchmark/cli.py" = ["UP017"]
"scripts/*.py" = ["UP017"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src/banking_lab"]
